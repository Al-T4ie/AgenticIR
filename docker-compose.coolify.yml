# ─────────────────────────────────────────────────────────────────────────────
#  AgenticIR — Coolify deployment stack
#
#  Deploy as a Coolify resource of type "Docker Compose", pointed at this repo
#  with the compose path /docker-compose.coolify.yml. The bootstrap script
#  (infra/coolify/bootstrap.py) creates that resource for you.
#
#  This file must stay at the repository root. Coolify resolves build.context
#  against the repo root rather than the compose file's directory, so a nested
#  copy using `context: ../..` escapes the clone and the build fails with
#  "open Dockerfile: no such file or directory".
#
#  Coolify conventions used here:
#    · SERVICE_FQDN_<SERVICE>_<PORT>  Coolify assigns the domain, writes the
#      proxy labels and provisions the Let's Encrypt certificate.
#    · SERVICE_PASSWORD_<NAME>        Coolify generates and persists a secret.
#    · SERVICE_BASE64_64_<NAME>       Coolify generates a 64-byte base64 secret.
#    · No container_name, no host port bindings — Coolify owns both.
#    · Named volumes are namespaced per resource by Coolify automatically.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Agent API, Slack endpoint and analyst dashboard ──────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      # Coolify assigns this FQDN and routes :8000 to it over HTTPS.
      SERVICE_FQDN_API_8000: ${SERVICE_FQDN_API_8000}
      PUBLIC_BASE_URL: ${SERVICE_FQDN_API_8000}

      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-${SERVICE_FQDN_API_8000}}

      # Generated once by Coolify, then stable across redeploys. This is the key
      # analysts use to sign into the dashboard and n8n uses to call the API.
      API_KEY: ${SERVICE_BASE64_64_APIKEY}

      # ── LLM ──
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL_SUPERVISOR: ${LLM_MODEL_SUPERVISOR:-claude-sonnet-5}
      LLM_MODEL_SPECIALIST: ${LLM_MODEL_SPECIALIST:-claude-haiku-4-5-20251001}
      LLM_MODEL_CRITIC: ${LLM_MODEL_CRITIC:-claude-opus-5}

      # ── Agent behaviour ──
      MAX_INVESTIGATION_ROUNDS: ${MAX_INVESTIGATION_ROUNDS:-3}
      MAX_PARALLEL_SPECIALISTS: ${MAX_PARALLEL_SPECIALISTS:-5}
      REQUIRE_APPROVAL_FOR_CONTAINMENT: ${REQUIRE_APPROVAL_FOR_CONTAINMENT:-true}
      AUTO_APPROVE_SEVERITY_BELOW: ${AUTO_APPROVE_SEVERITY_BELOW:-low}

      # ── Persistence ──
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: agenticir
      POSTGRES_USER: agenticir
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_URL: redis://redis:6379/0

      # ── Slack ──
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-#incident-response}

      # ── n8n bridge ──
      N8N_ENABLED: ${N8N_ENABLED:-true}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_TOKEN: ${SERVICE_BASE64_64_N8NTOKEN}
      N8N_TOOLS: ${N8N_TOOLS:-}

      # ── Observability ──
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agentic-ir}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /ready also checks the database, so a container with a dead DB is pulled
      # out of rotation instead of serving 500s.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Postgres: LangGraph checkpoints, incident index, n8n, pgvector ───────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agenticir
      POSTGRES_USER: agenticir
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # Postgres refuses to initialise a non-empty directory, so keep PGDATA in
      # a subdirectory of the mount point.
      PGDATA: /var/lib/postgresql/data/pgdata
      # The n8n database is created by the postgres-init service below, not by
      # an entrypoint script — see the comment there.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticir -d agenticir"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    deploy:
      resources:
        limits:
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── One-shot database bootstrap ──────────────────────────────────────────
  # Creates the n8n database and enables pgvector.
  #
  # This was originally a script mounted into /docker-entrypoint-initdb.d.
  # That does not survive Coolify: a relative host bind from the repo is not
  # mounted, so the directory arrived empty, no database was created, and n8n
  # crash-looped on `database "n8n" does not exist` — while the deployment
  # reported success. Postgres also only runs those scripts on a *fresh* data
  # directory, so the mechanism silently does nothing on any existing volume.
  # An explicit, idempotent init container avoids both traps.
  postgres-init:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        psql -h postgres -U agenticir -d agenticir -tAc \
          "SELECT 1 FROM pg_database WHERE datname='n8n'" | grep -q 1 \
          || psql -h postgres -U agenticir -d agenticir -c "CREATE DATABASE n8n"
        psql -h postgres -U agenticir -d agenticir -c "CREATE EXTENSION IF NOT EXISTS vector"
        psql -h postgres -U agenticir -d n8n -c "CREATE EXTENSION IF NOT EXISTS vector"
        echo "database bootstrap complete"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Redis: n8n queue mode + app-side caching ─────────────────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ── n8n: integration hub and automation surface ──────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      SERVICE_FQDN_N8N_5678: ${SERVICE_FQDN_N8N_5678}
      # WEBHOOK_URL and N8N_EDITOR_BASE_URL take a full URL. N8N_HOST takes a
      # bare hostname, and Coolify hands us a scheme-prefixed value — feeding it
      # one made n8n unhealthy and, because the worker gated on
      # `n8n: service_healthy`, failed the entire deployment. Behind a reverse
      # proxy the two URL settings are sufficient, so N8N_HOST is left unset.
      WEBHOOK_URL: ${SERVICE_FQDN_N8N_5678}
      N8N_EDITOR_BASE_URL: ${SERVICE_FQDN_N8N_5678}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: 1

      N8N_ENCRYPTION_KEY: ${SERVICE_BASE64_64_N8NENCRYPTION}

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: agenticir
      DB_POSTGRESDB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}

      # Queue mode so a burst of SIEM alerts is absorbed instead of dropped.
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # So workflows can call the agent API by service name with a valid key.
      AGENTICIR_API_URL: http://api:8000
      AGENTICIR_API_KEY: ${SERVICE_BASE64_64_APIKEY}
      AGENTICIR_WEBHOOK_TOKEN: ${SERVICE_BASE64_64_N8NTOKEN}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      # n8n runs database migrations on a cold volume before it serves /healthz,
      # which comfortably exceeds a 60s grace on first boot.
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ── n8n worker: executes queued workflow runs ────────────────────────────
  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    command: ["worker"]
    environment:
      N8N_ENCRYPTION_KEY: ${SERVICE_BASE64_64_N8NENCRYPTION}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: agenticir
      DB_POSTGRESDB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      AGENTICIR_API_URL: http://api:8000
      AGENTICIR_API_KEY: ${SERVICE_BASE64_64_APIKEY}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      # Deliberately service_started, not service_healthy. Gating the worker on
      # n8n's health makes a slow or unhealthy n8n fail the whole deployment,
      # including the API — which does not depend on n8n at all. The worker
      # retries its Redis and database connections on its own, so the only cost
      # of starting early is a few reconnect attempts.
      n8n:
        condition: service_started
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres-data:
  redis-data:
  n8n-data:
