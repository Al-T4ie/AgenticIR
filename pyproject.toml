[project]
name = "agentic-ir"
version = "0.1.0"
description = "Self-hosted agentic cybersecurity incident response platform (LangGraph + Slack + n8n)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # ── Web / API ──
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.12",
    "jinja2>=3.1,<4",

    # ── Agents ──
    "langgraph>=0.6,<0.8",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "langchain-core>=0.3,<1",
    "langchain-anthropic>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "langchain-ollama>=0.2,<1",

    # ── Persistence ──
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",

    # ── Slack ──
    # aiohttp is what slack_sdk's AsyncWebClient imports; it is not pulled in
    # by the base package.
    "slack-sdk>=3.33,<4",
    "aiohttp>=3.10,<4",

    # ── Ops ──
    "structlog>=24.4,<26",
    "tenacity>=9.0,<10",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-requests",
    # The CTI corpus is queried, not mocked, in tests: the co-occurrence joins
    # are the whole value of the module and a mock would assert them into
    # existence rather than prove them.
    "aiosqlite>=0.20,<1",
]

[project.scripts]
agentic-ir = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
