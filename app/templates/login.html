<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — AgenticIR</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2f40; --text:#e6e8ef; --muted:#98a0b3; --accent:#5b8def; --err:#ff5c6c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7fa; --panel:#fff; --line:#dfe3ec; --text:#131722; --muted:#5c6478; --accent:#2f6bd8; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:32px; width:min(400px, 92vw); }
  h1 { margin:0 0 6px; font-size:22px; }
  h1 span { color:var(--accent); }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:11px; font:inherit; }
  button { width:100%; margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:7px; padding:11px; font:inherit; font-weight:600; cursor:pointer; }
  .err { background:rgba(255,92,108,.12); border:1px solid var(--err); color:var(--err); padding:10px 12px; border-radius:7px; margin-bottom:16px; font-size:14px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/ui/login">
    <h1>Agentic<span>IR</span></h1>
    <p class="sub">Incident response console</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="api_key">API key</label>
    <input id="api_key" name="api_key" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
