<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AgenticIR{% endblock %}</title>
<style>
  /* Self-contained: no CDN, so the dashboard works behind a strict CSP. */
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --line: #2a2f40;
    --text: #e6e8ef; --muted: #98a0b3; --accent: #5b8def; --accent-dim: #3a5da8;
    --crit: #ff4d5e; --high: #ff8a3d; --med: #ffc44d; --low: #64d2a0; --info: #6aa8ff;
    --ok: #3ecf8e; --warn: #ffb020; --err: #ff5c6c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fa; --panel: #ffffff; --panel-2: #f0f2f7; --line: #dfe3ec;
      --text: #131722; --muted: #5c6478; --accent: #2f6bd8; --accent-dim: #9dbaf0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .brand span { color: var(--accent); }
  header nav { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 18px;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .sev-critical { background: rgba(255,77,94,.16); color: var(--crit); }
  .sev-high { background: rgba(255,138,61,.16); color: var(--high); }
  .sev-medium { background: rgba(255,196,77,.16); color: var(--med); }
  .sev-low { background: rgba(100,210,160,.16); color: var(--low); }
  .sev-informational { background: rgba(106,168,255,.16); color: var(--info); }
  .st-running { color: var(--warn); }
  .st-completed { color: var(--ok); }
  .st-awaiting_approval { color: var(--accent); font-weight: 600; }
  .st-failed { color: var(--err); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  input[type=text], input[type=password], textarea, select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 9px 11px; font: inherit; width: 100%;
  }
  button, .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--err); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .stat { background: var(--panel-2); border-radius: 9px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  pre.report {
    white-space: pre-wrap; word-wrap: break-word; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 16px; font: inherit; margin: 0;
  }
  .report.md {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px 18px;
  }
  .report.md > :first-child { margin-top: 0; }
  .report.md > :last-child { margin-bottom: 0; }
  .report.md p { margin: 0 0 10px; max-width: 74ch; }
  .report.md ul { margin: 0 0 10px; padding-left: 20px; }
  .report.md li { margin-bottom: 4px; }
  .report.md code {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-family: ui-monospace, monospace; font-size: 12.5px;
  }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { padding: 8px 0 8px 16px; border-left: 2px solid var(--line); margin-left: 6px; }
  .timeline li b { color: var(--accent); }
  .finding { border-left: 3px solid var(--line); padding: 10px 14px; margin-bottom: 10px; background: var(--panel-2); border-radius: 0 8px 8px 0; }
  .finding.critical, .finding.high { border-left-color: var(--crit); }
  .finding.medium { border-left-color: var(--med); }
  .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--line); }
  .banner.approve { background: rgba(91,141,239,.12); border-color: var(--accent-dim); }
  .banner.error { background: rgba(255,92,108,.12); border-color: var(--err); }
  .tag { display:inline-block; background: var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:1px 7px; margin:2px 4px 2px 0; font-size:12px; }

  /* Investigation timeline. Inline SVG so it needs no script and no CDN, and
     scales with the viewBox rather than a fixed pixel width. */
  .chart-wrap { overflow-x: auto; }
  .gantt { width: 100%; min-width: 640px; height: auto; display: block; }
  .gantt .lane-label { fill: var(--muted); font-size: 12px; font-family: inherit; }
  .gantt .lane-rule { stroke: var(--line); stroke-width: 1; }
  .gantt .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; opacity: .6; }
  .gantt .tick { fill: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .gantt .run-band { fill: var(--panel-2); opacity: .55; }
  .gantt .run-edge { stroke: var(--accent-dim); stroke-width: 1; stroke-dasharray: 3 3; }
  .gantt .run-label { fill: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
  .gantt .span-text { fill: var(--bg); font-size: 10px; font-family: ui-monospace, monospace; font-weight: 700; }
  .gantt .span { opacity: .95; }
  .gantt .span.failed { fill: var(--err) !important; }
  /* An unfinished span is an inference, not a measurement — show it hollow. */
  .gantt .span.open { opacity: .35; }
  .gantt .k-intake  { fill: var(--muted); }
  .gantt .k-plan    { fill: var(--accent); }
  .gantt .k-work    { fill: var(--low); }
  .gantt .k-review  { fill: var(--med); }
  .gantt .k-action  { fill: var(--high); }
  .gantt .k-human   { fill: var(--info); }
  i.key { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  i.key.k-plan { background: var(--accent); }
  i.key.k-work { background: var(--low); }
  i.key.k-review { background: var(--med); }
  i.key.k-action { background: var(--high); }
  i.key.k-human { background: var(--info); }

  /* ── Agent graph: the topology, with this incident's state on it ── */
  .agraph { width: 100%; min-width: 780px; height: auto; display: block; }
  .agraph text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
  .agraph .gsub { font-size: 10.5px; font-weight: 400; fill: var(--muted); }
  .agraph .gl { fill: var(--muted); font-size: 10.5px; font-weight: 400; }

  /* One rule per state, applied to the group; the rect and the label both
     pick it up so a node never half-changes colour. */
  .agraph .gn rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
  .agraph .gn text { fill: var(--text); }
  .agraph .gn.done rect     { stroke: var(--ok); }
  .agraph .gn.active rect   { fill: rgba(91,141,239,.18); stroke: var(--accent); stroke-width: 2.5; }
  .agraph .gn.waiting rect  { fill: rgba(255,176,32,.16); stroke: var(--warn); stroke-width: 2.5; }
  .agraph .gn.failed rect   { fill: rgba(255,92,108,.14); stroke: var(--err); stroke-width: 2; }
  .agraph .gn.failed text   { fill: var(--err); }
  /* Queued and never-dispatched are different facts: one is still coming, the
     other was decided against. Both recede, only one keeps its outline. */
  .agraph .gn.pending rect  { opacity: .5; }
  .agraph .gn.pending text  { opacity: .5; }
  .agraph .gn.skipped rect  { opacity: .4; stroke-dasharray: 4 3; }
  .agraph .gn.skipped text  { opacity: .4; }
  .agraph .gn.unused rect   { opacity: .35; stroke-dasharray: 4 3; }
  .agraph .gn.unused text   { opacity: .35; }

  .agraph .ge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .agraph .ge.done    { stroke: var(--ok); opacity: .8; }
  .agraph .ge.active  { stroke: var(--accent); stroke-width: 2; }
  .agraph .ge.waiting { stroke: var(--warn); stroke-width: 2; }
  .agraph .ge.failed  { stroke: var(--err); }
  .agraph .ge.pending, .agraph .ge.skipped, .agraph .ge.unused { opacity: .4; }
  .agraph .ge.dash { stroke-dasharray: 5 4; }

  .glegend { margin-top: 10px; font-size: 12px; }
  .gtag {
    font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 600;
    border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line);
  }
  .gtag.active  { color: var(--accent); border-color: var(--accent-dim); background: rgba(91,141,239,.12); }
  .gtag.waiting { color: var(--warn); border-color: var(--warn); background: rgba(255,176,32,.12); }
  .gtag.failed  { color: var(--err); border-color: var(--err); background: rgba(255,92,108,.12); }

  /* ── ATT&CK ── */
  .chain-wrap { overflow-x: auto; margin-bottom: 16px; }
  .chain { list-style: none; display: flex; gap: 4px; padding: 0; margin: 0; min-width: 760px; }
  /* min-width:0 is load-bearing — without it a flex item refuses to shrink
     below its longest word, and "COMMAND & CONTROL" pushes all fourteen
     columns into a horizontal scroll on an otherwise roomy screen. */
  .chain .tac {
    flex: 1 1 0; min-width: 0; border-radius: 6px; padding: 8px 6px;
    background: var(--panel-2); border: 1px solid var(--line); text-align: center;
  }
  .chain .tl {
    display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .3px;
    color: var(--muted); line-height: 1.25; min-height: 36px; overflow-wrap: anywhere;
  }
  .chain .tn {
    display: block; margin-top: 5px; font-weight: 700; font-size: 17px;
    font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums;
  }
  .chain .miss { opacity: .4; }
  .chain .miss .tn { color: var(--muted); font-weight: 400; }
  .chain .hit { border-color: var(--accent-dim); }
  .chain .sev-b-critical, .chain .sev-b-high { border-color: var(--crit); }
  .chain .sev-b-critical .tn, .chain .sev-b-high .tn { color: var(--crit); }
  .chain .sev-b-medium { border-color: var(--med); }
  .chain .sev-b-medium .tn { color: var(--med); }
  .chain .sev-b-low .tn, .chain .sev-b-informational .tn { color: var(--low); }

  .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(272px, 1fr)); gap: 14px; }
  .tac-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); margin-bottom: 7px; font-weight: 700;
  }
  details.tech { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; margin-bottom: 7px; }
  details.tech > summary {
    cursor: pointer; padding: 9px 11px; display: flex; gap: 8px; align-items: baseline;
    list-style: none;
  }
  details.tech > summary::-webkit-details-marker { display: none; }
  details.tech > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
  details.tech[open] > summary::before { content: "▾"; }
  details.tech .tid { color: var(--accent); font-weight: 700; }
  details.tech .tname { flex: 1; font-size: 13.5px; }
  .approx {
    display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; vertical-align: 1px;
    font-family: ui-monospace, monospace;
  }
  details.tech .cnt {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 7px; font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted);
  }
  details.tech .tech-body { padding: 0 11px 11px; }

  details.dig { margin-top: 14px; }
  details.dig > summary {
    cursor: pointer; color: var(--accent); font-size: 13.5px; font-weight: 600;
  }
  ul.plain { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.plain li { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  ul.plain li:last-child { border-bottom: none; }
  .bad { color: var(--err); }

  /* ── Report page ── */
  .report-head { border-bottom: 2px solid var(--line); padding-bottom: 18px; margin-bottom: 22px; }
  .report-head h1 { font-size: 26px; margin: 0 0 10px; }
  .verdict-line { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .meta { background: var(--panel-2); border-radius: 8px; padding: 11px 13px; }
  .meta .l { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .meta .v { font-weight: 600; margin-top: 3px; font-size: 14px; }

  /* ── Collapsible report sections ──────────────────────────────────────
     <details> rather than script: this page is printed and archived, and a
     panel that only opens with JavaScript is a panel that is blank in the PDF.
     The print rules below force every one open. */
  details.fold { padding: 0; }
  details.fold > summary {
    list-style: none; cursor: pointer; padding: 18px;
    display: flex; align-items: center; gap: 10px;
    border-radius: 10px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before {
    content: "▸"; color: var(--muted); font-size: 12px;
    transition: transform .12s ease; flex: none;
  }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary:hover { background: var(--hover, rgba(127,127,127,.06)); }
  details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  details.fold > summary h2 { margin: 0; }
  details.fold > *:not(summary) { padding: 0 18px 18px; }
  details.fold > .table-wrap { margin: 0 18px 18px; padding: 0; }

  /* A nested disclosure inside an open panel — the fleet means, the raw
     responses. Quieter than the panel itself so the hierarchy reads. */
  details.sub { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  details.sub > summary {
    cursor: pointer; color: var(--muted); font-size: 13.5px;
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.sub > summary::-webkit-details-marker { display: none; }
  details.sub > summary::before { content: "▸"; font-size: 11px; transition: transform .12s ease; }
  details.sub[open] > summary::before { transform: rotate(90deg); }
  details.sub > summary:hover { color: var(--fg); }

  /* ── Response times ───────────────────────────────────────────────────
     The bar is the argument: agents compress the left half and can do
     nothing about the right. */
  .tt-split { margin-bottom: 18px; }
  .tt-bar {
    display: flex; height: 10px; border-radius: 5px; overflow: hidden;
    background: var(--line); margin-bottom: 8px;
  }
  .tt-bar .tt-machine { background: var(--ok, #2e9e6b); }
  .tt-bar .tt-human { background: var(--warn, #c98a2b); }
  .tt-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .tt-legend .sw {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px;
  }
  .tt-legend .sw.machine { background: var(--ok, #2e9e6b); }
  .tt-legend .sw.human { background: var(--warn, #c98a2b); }

  .tt-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
  }
  .tt { background: var(--panel); padding: 12px 14px; }
  .tt.lead { background: var(--hover, rgba(127,127,127,.05)); }
  .tt .k { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .tt .n { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tt .l { font-size: 13px; }
  .tt .note { font-size: 11.5px; margin-top: 2px; }

  /* ── Questions ────────────────────────────────────────────────────────*/
  .qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .qlist .q { display: flex; gap: 11px; align-items: flex-start; }
  .qlist .qmark {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px;
  }
  .qlist .q.done .qmark { background: rgba(46,158,107,.16); color: var(--ok, #2e9e6b); }
  .qlist .q.open .qmark { background: rgba(201,138,43,.16); color: var(--warn, #c98a2b); }
  .qlist .qmeta { font-size: 11.5px; margin-top: 3px; }

  @media print {
    header, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .panel { border-color: #ccc; break-inside: avoid; }
    main { max-width: none; padding: 0; }
    /* A collapsed section must not print as a heading with nothing under it —
       the printed report is the artefact an auditor is handed. */
    details.fold > *, details.sub > * { display: revert !important; }
    details.fold > summary::before, details.sub > summary::before { content: ""; }
    details.fold, details.sub { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Agentic<span>IR</span></div>
  <nav>
    <a href="/ui">Incidents</a>
    <a href="/docs">API</a>
    <form method="post" action="/ui/logout" style="margin:0">
      <button class="secondary" type="submit">Sign out</button>
    </form>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
